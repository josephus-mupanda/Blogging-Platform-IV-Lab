
spring.datasource.url=${DB_POSTGRES_URL:jdbc:postgresql://localhost:5433/blogging_platform_iv}
spring.datasource.username=${DB_POSTGRES_USER:postgres}
spring.datasource.password=${DB_POSTGRES_PASSWORD:postgres}
spring.data.mongodb.uri=${DB_MONGO_URI:mongodb://localhost:27017/blogging_platform_iv?serverSelectionTimeoutMS=3000}
spring.graphql.graphiql.enabled=true

# Show the AOP logging and timing from ServiceMonitoring in the console.
# The aspect logs at DEBUG, which is off by default, so nothing appears without this line.
# Only the dev profile turns it on; prod stays quiet.
logging.level.com.example.Blogging_Platform_IV.config.ServiceMonitoring=DEBUG

# Show when Spring starts, commits and ROLLS BACK a transaction, for example:
#   "Initiating transaction rollback" / "Rolling back JPA transaction on EntityManager"
# Put a # in front of this line if the console becomes too busy.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
