spring.application.name=Blogging-Platform-III
server.address=127.0.0.1
spring.profiles.default=dev
spring.data.mongodb.auto-index-creation=true
springdoc.paths-to-match=/api/**

# Spring Data JPA
# "validate" makes Hibernate check at startup that every entity matches the existing tables.
# It never creates or changes a table: db/schema.sql owns the schema.
spring.jpa.hibernate.ddl-auto=validate
# The database session closes when the service method returns.
# Services return finished response objects, so the web layer never needs the session.
spring.jpa.open-in-view=false
