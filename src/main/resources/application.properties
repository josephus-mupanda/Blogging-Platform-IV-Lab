spring.application.name=Blogging-Platform-IV
server.address=127.0.0.1
spring.profiles.default=dev
spring.data.mongodb.auto-index-creation=true
springdoc.paths-to-match=/api/**,/auth/**

# Spring Data JPA
# "update": Hibernate creates the tables, relationships and indexes from the entity classes,
# and adds what is missing when an entity changes. Existing data is kept.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pagination: a client can ask for at most 100 items per page.
#spring.data.web.pageable.max-page-size=100
# Send pages as { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }.
spring.data.web.pageable.serialization-mode=via_dto

# Spring Cache: keep the cached values in memory, inside the application.
spring.cache.type=simple

# Lab 4: the ADMIN account created at startup (registration cannot create admins).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}

# Lab 4: a JWT is valid for 60 minutes. The signing secret comes from the profile files.
app.jwt.expiration-minutes=60

# Lab 4: the browser origins allowed to call the API (comma separated), for example a React or Vite app.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Lab 4: every log line (including the security.audit events) is also written to this file.
logging.file.name=logs/application.log

# Read the .env file of the project folder (ignored by git). The Google values can be written there.
spring.config.import=optional:file:.env[.properties]

# Lab 4: Google login. Create an OAuth client in the Google Cloud console and pass its values
# in the environment. Without them the app still starts, and only the Google login fails.
# Authorized redirect URI to register at Google: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
