# =====================================================================
#  Blogging Platform IV - GraphQL examples
# =====================================================================
#  1. Start the app:  .\mvnw.cmd spring-boot:run
#  2. Log in to get a token. In a terminal or in Postman:
#       POST http://localhost:8080/auth/login
#       { "username": "admin", "password": "Admin@12345" }
#     Copy the "token" from the answer.
#  3. Open            http://localhost:8080/graphiql
#     Click "Headers" at the bottom and paste (with your token):
#       { "Authorization": "Bearer <token>" }
#     Without the header every request gets 401.
#  4. Paste ONE block, then press the play button (or Ctrl+Enter).
#
#  What each role may do (a role that is not allowed gets extensions.code = FORBIDDEN):
#    ADMIN   everything (users, dashboard, delete posts and tags)
#    AUTHOR  read, create and update posts and tags, add comments and reviews
#    READER  read posts and tags, add comments and reviews
#  The IDs assume user 1, tag 1 and post 1 exist. Block 1 shows the real IDs.
# =====================================================================


# 1. WHAT IS IN MY DATABASE? (ADMIN only: users and dashboard)
{
  users { id username displayName role }
  tags { id name }
  dashboard { users posts tags comments reviews }
}


# 2. ONE PAGE OF POSTS (newest first). Add keyword: "spring" to search.
{
  posts(page: 0, size: 500) {
    totalElements
    totalPages
    number
    size
    content {
      id
      title
      author { username }
      tags { name }
    }
  }
}


# 3. CREATE A USER (ADMIN only. Change the username and email before running again.
#    role is optional: ADMIN, AUTHOR or READER, and READER when it is left out)
mutation {
  createUser(input: { username: "graphql_author", email: "graphql_author@example.test", displayName: "GraphQL Author", password: "Author@12345", role: AUTHOR }) {
    id
    username
  }
}


# 4. CREATE A TAG
mutation {
  createTag(input: { name: "graphql-demo" }) { id name }
}


# 5. CREATE A POST (use your own authorId and tagIds)
mutation {
  createPost(authorId: 1, input: { title: "My first GraphQL post", body: "Created from GraphiQL.", tagIds: [1] }) {
    id
    title
    tags { name }
  }
}


# 6. ADD A COMMENT AND A REVIEW (MongoDB)
mutation {
  addComment(postId: 1, authorId: 1, input: { body: "Very useful." }) { id body authorName }
  addReview(postId: 1, reviewerId: 1, input: { rating: 5, text: "Clear." }) { id rating }
}


# 7. ONE POST WITH ITS COMMENTS AND REVIEWS, in one request
{
  post(id: 1) { title body tags { name } }
  comments(postId: 1, page: 0, size: 5) {
    totalElements
    content { body authorName }
  }
  reviews(postId: 1) { rating text reviewerName }
}


# 8. HOW ERRORS LOOK (extensions.code = NOT_FOUND)
{
  post(id: 999999) { id title }
}


# 9. HOW VALIDATION ERRORS LOOK
mutation {
  createUser(input: { username: "x", email: "not-an-email", displayName: "", password: "abc" }) { id }
}
