<svg xmlns="http://www.w3.org/2000/svg" width="850" height="802" viewBox="0 0 850 802" role="img">
<title>The layers a request passes through</title>
<defs><marker id="arrow-4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="arrow-d64545" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs>
<rect width="850" height="802" fill="#ffffff"/>
<rect x="30" y="20" width="470" height="78" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="44" y="43" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Client</text>
<text x="44" y="63" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Postman, React or JavaFX sends the request with the header</text>
<text x="44" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Authorization: Bearer &lt;token&gt;</text>
<line x1="265" y1="98" x2="265" y2="128" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<rect x="30" y="128" width="470" height="78" rx="10" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="44" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">1. CORS check</text>
<text x="44" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Is the Origin one of the allowed browser origins?</text>
<text x="44" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">(Postman and curl send no Origin, so they pass)</text>
<line x1="265" y1="206" x2="265" y2="236" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<line x1="500" y1="167" x2="560" y2="167" stroke="#d64545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-d64545)"/>
<rect x="562" y="147" width="250" height="40" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/>
<text x="574" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b1c1c">403 Invalid CORS request</text>
<rect x="30" y="236" width="470" height="78" rx="10" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="44" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">2. Filter chain chosen by the URL</text>
<text x="44" y="279" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">/csrf-demo: session + CSRF token | /oauth2: Google login</text>
<text x="44" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">everything else: stateless API chain (no session, CSRF off)</text>
<line x1="265" y1="314" x2="265" y2="344" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<rect x="30" y="344" width="470" height="78" rx="10" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="44" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">3. JwtAuthenticationFilter</text>
<text x="44" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Checks the HMAC SHA-256 signature and the expiry date,</text>
<text x="44" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">then looks the token up in the blacklist (a hash map)</text>
<line x1="265" y1="422" x2="265" y2="452" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<line x1="500" y1="383" x2="560" y2="383" stroke="#d64545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-d64545)"/>
<rect x="562" y="363" width="250" height="40" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/>
<text x="574" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b1c1c">401 token bad, expired or revoked</text>
<rect x="30" y="452" width="470" height="78" rx="10" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="44" y="475" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">4. Access rules (SecurityFilterChain)</text>
<text x="44" y="495" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Public: /auth/login, /auth/register, Swagger UI</text>
<text x="44" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Everything else needs a logged-in user</text>
<line x1="265" y1="530" x2="265" y2="560" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<line x1="500" y1="491" x2="560" y2="491" stroke="#d64545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-d64545)"/>
<rect x="562" y="471" width="250" height="40" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/>
<text x="574" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b1c1c">401 no token, not logged in</text>
<rect x="30" y="560" width="470" height="78" rx="10" fill="#e8f1ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="44" y="583" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">5. @PreAuthorize on the controller method</text>
<text x="44" y="603" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">Is the role in the token allowed? ADMIN, AUTHOR or READER</text>
<text x="44" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">(same rules for REST and GraphQL)</text>
<line x1="265" y1="638" x2="265" y2="668" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow-4b5563)"/>
<line x1="500" y1="599" x2="560" y2="599" stroke="#d64545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-d64545)"/>
<rect x="562" y="579" width="250" height="40" rx="8" fill="#fdeaea" stroke="#d64545" stroke-width="1.6"/>
<text x="574" y="604" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9b1c1c">403 role not allowed</text>
<rect x="30" y="668" width="470" height="78" rx="10" fill="#e6f7ec" stroke="#2e8b57" stroke-width="1.6"/>
<text x="44" y="691" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">6. Controller, Service, Database</text>
<text x="44" y="711" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">PostgreSQL: users, posts, tags | MongoDB: comments, reviews</text>
<text x="44" y="728" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">The answer goes back to the client</text>
<text x="30" y="782" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937">Every refusal (red) and every login is written to the security log (security.audit) and counted for GET /api/security/report.</text>
</svg>
